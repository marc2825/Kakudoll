name: CI

# Unityライセンス不要の検証(license-free)と公開履歴の監査は常に実行する。
# Unity EditMode/PlayModeはライセンスSecretがある場合だけ実行し、ない場合はNOT RUNとして
# job summaryと警告annotationに明示する(skippedはPASSではない)。
# リポジトリ変数 VLAT_REQUIRE_UNITY_TESTS=true のときは、ライセンス未設定をCI失敗にする。
# 最後の release-readiness が全ジョブをPASS/FAIL/NOT RUNで集計し、1つでもPASS以外なら
# 「公開準備: NOT READY」とする。workflow_dispatch で release_check=true のときはNOT READYをCI失敗にする。
# 設定手順: docs/CI_SETUP.md

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_check:
        description: "公開前の検証として実行する（NOT RUNが1つでもあれば失敗にする）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-free:
    name: License-free checks (Schema / Core .NET / evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.10,<5"

      - name: Run license-free checks
        run: python scripts/run_license_free_checks.py --log artifacts/license-free-checks.log

      - name: Upload license-free results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-free-results
          path: |
            artifacts/license-free-checks.log
            artifacts/core/
          if-no-files-found: warn

  unity-license:
    name: Unity license preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Unity license configuration (values are never printed)
        id: check
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
          HAS_SERVER: ${{ secrets.UNITY_LICENSING_SERVER != '' }}
          REQUIRE_UNITY: ${{ vars.VLAT_REQUIRE_UNITY_TESTS == 'true' }}
        run: |
          # game-ci/unity-test-runner v4.3.2 の受理条件と同じ:
          #   EMAIL + PASSWORD + (SERIAL または LICENSE)、または LICENSING_SERVER
          available=false
          if [ "$HAS_SERVER" = "true" ]; then
            available=true
          elif [ "$HAS_EMAIL" = "true" ] && [ "$HAS_PASSWORD" = "true" ] && \
               { [ "$HAS_SERIAL" = "true" ] || [ "$HAS_LICENSE" = "true" ]; }; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          {
            echo "## Unity license preflight"
            echo ""
            echo "| Secret | Configured |"
            echo "|---|---|"
            echo "| UNITY_EMAIL | $HAS_EMAIL |"
            echo "| UNITY_PASSWORD | $HAS_PASSWORD |"
            echo "| UNITY_LICENSE (.ulf) | $HAS_LICENSE |"
            echo "| UNITY_SERIAL | $HAS_SERIAL |"
            echo "| UNITY_LICENSING_SERVER | $HAS_SERVER |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$available" = "true" ]; then
            echo "Unity EditMode/PlayMode jobs will run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          message="Unity EditMode/PlayMode: NOT RUN - Unity license secrets are not configured (or unavailable to this event, e.g. fork PR). See docs/CI_SETUP.md. This is not a test PASS."
          echo "**$message**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE_UNITY" = "true" ]; then
            echo "::error title=Unity tests NOT RUN::$message"
            exit 1
          fi
          echo "::warning title=Unity tests NOT RUN::$message"

  editmode:
    name: Unity EditMode
    needs: unity-license
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: VLatProject/Library
          key: unity-2022.3.62f3-${{ runner.os }}-${{ hashFiles('Packages/**', 'VLatProject/Packages/**', 'VLatProject/ProjectSettings/**') }}
          restore-keys: |
            unity-2022.3.62f3-${{ runner.os }}-

      - name: Run EditMode tests
        id: tests
        # v4.3.2 (stable architecture, node24). Pinned by commit for supply-chain safety.
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          projectPath: VLatProject
          unityVersion: 2022.3.62f3
          testMode: editmode
          artifactsPath: artifacts/editmode
          coverageOptions: generateAdditionalReports;generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+VLat.Core
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # テストが起動しなかった場合、step outputは空になる。空pathでのupload二次エラーを避ける。
      - name: Upload test results
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v7
        with:
          name: editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

      - name: Upload coverage
        if: always() && steps.tests.outputs.coveragePath != ''
        uses: actions/upload-artifact@v7
        with:
          name: editmode-coverage
          path: ${{ steps.tests.outputs.coveragePath }}
          if-no-files-found: warn

      - name: Enforce Core line coverage
        if: steps.tests.outcome == 'success'
        run: >-
          python scripts/check_coverage.py
          "${{ steps.tests.outputs.coveragePath }}"
          --assembly VLat.Core
          --minimum 0.80

  playmode:
    name: Unity PlayMode
    needs: unity-license
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: VLatProject/Library
          key: unity-2022.3.62f3-${{ runner.os }}-${{ hashFiles('Packages/**', 'VLatProject/Packages/**', 'VLatProject/ProjectSettings/**') }}
          restore-keys: |
            unity-2022.3.62f3-${{ runner.os }}-

      - name: Run PlayMode and performance tests
        id: tests
        uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          projectPath: VLatProject
          unityVersion: 2022.3.62f3
          testMode: playmode
          artifactsPath: artifacts/playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PlayMode and performance results
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v7
        with:
          name: playmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn

  public-history-audit:
    name: Public history audit (Gitleaks + check_public_export --git-history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      author_emails: ${{ steps.audit.outputs.author_emails }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/checkout は branch と tag しか取得しない。notes / replace も公開されていれば検査対象に含める。
      # 認証はこのstepだけに渡す（tokenはログでマスクされる。checkoutには保存しない）。
      - name: Fetch notes and replace refs
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin '+refs/notes/*:refs/notes/*' '+refs/replace/*:refs/replace/*'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Gitleaks (pinned, SHA-256 verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # 既定の log-opts は `--full-history --all`。値は --redact で伏せる。-v は作者メールを出すため付けない。
      - name: Gitleaks (all refs, values redacted)
        run: gitleaks git --redact --no-banner --exit-code 1 .

      # 作者メールは所有者が公開を認めたものだけを許可する（リポジトリ変数、カンマ区切り）。
      # 未設定ならメール検査だけをNOT RUNとして記録し、ほかの検査は実行する。
      - name: Public export audit (current tree + full Git history)
        id: audit
        env:
          VLAT_PUBLIC_AUTHOR_EMAILS: ${{ vars.VLAT_PUBLIC_AUTHOR_EMAILS }}
        run: |
          if [ -n "$VLAT_PUBLIC_AUTHOR_EMAILS" ]; then
            python3 -B scripts/check_public_export.py . --git-history --allow-email "$VLAT_PUBLIC_AUTHOR_EMAILS"
            echo "author_emails=PASS" >> "$GITHUB_OUTPUT"
          else
            python3 -B scripts/check_public_export.py . --git-history --skip-author-emails
            echo "author_emails=NOT RUN" >> "$GITHUB_OUTPUT"
            echo "::warning title=Author email check NOT RUN::Repository variable VLAT_PUBLIC_AUTHOR_EMAILS is not set. See docs/CI_SETUP.md."
          fi

  release-readiness:
    name: Release readiness (PASS / FAIL / NOT RUN)
    needs: [license-free, unity-license, editmode, playmode, public-history-audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize results
        env:
          LICENSE_FREE: ${{ needs.license-free.result }}
          EDITMODE: ${{ needs.editmode.result }}
          PLAYMODE: ${{ needs.playmode.result }}
          HISTORY: ${{ needs.public-history-audit.result }}
          AUTHOR_EMAILS: ${{ needs.public-history-audit.outputs.author_emails }}
          RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
          SHA: ${{ github.sha }}
        run: |
          status() {
            case "$1" in
              success) echo "PASS" ;;
              skipped|cancelled|"") echo "NOT RUN" ;;
              *) echo "FAIL" ;;
            esac
          }
          emails="${AUTHOR_EMAILS:-NOT RUN}"
          if [ "$HISTORY" != "success" ]; then emails="$(status "$HISTORY")"; fi
          rows=(
            "License-free checks (Schema / Core .NET / save crash / evidence)|$(status "$LICENSE_FREE")"
            "Unity EditMode + VLat.Core coverage >= 80%|$(status "$EDITMODE")"
            "Unity PlayMode + performance gate|$(status "$PLAYMODE")"
            "Public history audit (Gitleaks + tree/history scan)|$(status "$HISTORY")"
            "Author email allow-list|$emails"
          )
          ready=true
          {
            echo "## Release readiness for \`${SHA}\`"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            for row in "${rows[@]}"; do
              echo "| ${row%%|*} | ${row##*|} |"
              [ "${row##*|}" = "PASS" ] || ready=false
            done
            echo ""
            if [ "$ready" = "true" ]; then
              echo "**公開準備: READY**（自動検査のみ。権利の手動確認は docs/PUBLIC_RELEASE_CHECKLIST.md）"
            else
              echo "**公開準備: NOT READY** — PASS以外の項目があります。NOT RUNはPASSではありません。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ready" != "true" ]; then
            if [ "$RELEASE_CHECK" = "true" ]; then
              echo "::error title=Release readiness::NOT READY. See the job summary."
              exit 1
            fi
            echo "::warning title=Release readiness::NOT READY (Unity tests or other checks did not all PASS). See the job summary."
          fi
